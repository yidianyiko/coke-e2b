<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 TickTick · Coke</title><style>
body{font:16px system-ui;margin:48px auto;padding:0 22px;max-width:640px;background:#f5f7fa;color:#172132}section{background:#fff;border:1px solid #dce2ea;border-radius:12px;padding:24px;margin:20px 0}h1{font-size:28px}h2{font-size:20px}label{display:block;margin:18px 0 8px}input,button{font:inherit;padding:12px;border:1px solid #abb6c5;border-radius:6px}input{width:100%;box-sizing:border-box}button{cursor:pointer;margin:12px 8px 0 0;background:#eef3ff}button:disabled{opacity:.5;cursor:wait}#submit{background:#174ebc;color:white;border-color:#174ebc}small{display:block;color:#526175;margin-top:12px;line-height:1.6}#status{line-height:1.7;min-height:28px}pre{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}
</style><script src="/login.js" defer></script></head><body>
<h1>连接 TickTick</h1><p>填写账号凭证，授权 Agent 在后台登录并继续你的任务。</p><p id="status" role="status">正在检查授权链接…</p>
<section id="credentialsSection"><h2>账号凭证</h2><p>网站：<strong id="site">ticktick.com</strong></p><form id="credentialsForm"><label for="email">邮箱</label><input id="email" type="email" autocomplete="username" maxlength="254" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" maxlength="4096" required><button id="submit" type="submit" disabled>保存凭证并授权登录</button></form><button id="useStored" hidden disabled>使用已保存的凭证并继续</button><small>凭证会加密保存在你的 Vault 中，供后台代填；模型无法读取密码明文。当前支持 TickTick 邮箱与密码登录。</small></section>
<section id="codeSection" hidden><h2>补充验证码</h2><p>TickTick 要求验证身份。请输入收到的验证码或身份验证器中的动态码。</p><form id="codeForm"><label for="code">验证码</label><input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{4,10}" maxlength="10" required><button type="submit" id="submitCode">提交验证码</button></form><small>验证码仅用于这次验证，不会存入 Vault。</small></section>
<section><h2>授权后的任务</h2><p id="taskDescription"></p><pre id="result"></pre><div id="artifacts"></div></section>
<button id="cancel" disabled>取消本次授权</button><button id="delete" disabled>删除已保存凭证和登录状态</button>
</body></html>
